defaultDashboardsEnabled: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 24h
    nodeSelector:
      eks.amazonaws.com/capacityType: ON_DEMAND

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  nodeSelector:
    eks.amazonaws.com/capacityType: ON_DEMAND
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  deploymentStrategy:
    type: Recreate

  sidecar:
    datasources:
      alertmanager:
        enabled: false

  grafana.ini:
    smtp:
      enabled: false
      host: smtp.gmail.com:587
      user: aakashrsethi39@gmail.com
      from_address: aakashrsethi39@gmail.com
      from_name: Hotstar Grafana
      skip_verify: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: grafana

  extraConfigmapMounts:
    - name: grafana-contactpoints
      mountPath: /etc/grafana/provisioning/alerting/contactpoints.yaml
      subPath: contactpoints.yaml
      configMap: grafana-alerting-provisioning
      readOnly: true

    - name: grafana-policies
      mountPath: /etc/grafana/provisioning/alerting/policies.yaml
      subPath: policies.yaml
      configMap: grafana-alerting-provisioning
      readOnly: true
                
  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Hotstar Monitoring
          folder: Hotstar Monitoring
          interval: 1m
          rules:

            - uid: hotstar-high-cpu
              title: Hotstar High CPU
              condition: C
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: Hotstar pods have high CPU usage
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    expr: sum(rate(container_cpu_usage_seconds_total{namespace="hotstar",pod=~"hotstar-clone-.*",container!="POD",container!=""}[5m]))
                    refId: A

                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    type: reduce
                    expression: A
                    reducer: last
                    refId: B

                - refId: C
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: B
                    refId: C
                    conditions:
                      - type: query
                        query:
                          params:
                            - B
                        reducer:
                          type: last
                          params: []
                        evaluator:
                          type: gt
                          params:
                            - 0.7
                        operator:
                          type: and

            - uid: hotstar-pod-failure
              title: Hotstar Pod Failure
              condition: C
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: Hotstar has fewer than 2 running pods
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    expr: count(kube_pod_status_phase{namespace="hotstar",pod=~"hotstar-clone-.*",phase="Running"})
                    refId: A

                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    type: reduce
                    expression: A
                    reducer: last
                    refId: B

                - refId: C
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: B
                    refId: C
                    conditions:
                      - type: query
                        query:
                          params:
                            - B
                        reducer:
                          type: last
                          params: []
                        evaluator:
                          type: lt
                          params:
                            - 2
                        operator:
                          type: and

            - uid: hotstar-hpa-maximum
              title: Hotstar HPA Maximum
              condition: C
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: Hotstar HPA has reached maximum replicas
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="hotstar",horizontalpodautoscaler="hotstar-clone"}
                    refId: A

                - refId: B
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: __expr__
                  model:
                    type: reduce
                    expression: A
                    reducer: last
                    refId: B

                - refId: C
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    type: threshold
                    expression: B
                    refId: C
                    conditions:
                      - type: query
                        query:
                          params:
                            - B
                        reducer:
                          type: last
                          params: []
                        evaluator:
                          type: gte
                          params:
                            - 6
                        operator:
                          type: and
prometheus:
  prometheusSpec:
    nodeSelector:
      eks.amazonaws.com/capacityType: ON_DEMAND
    replicas: 1
    retention: 30d
    retentionSize: 8GB

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
