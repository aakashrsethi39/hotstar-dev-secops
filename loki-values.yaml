deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 720h

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1

  nodeSelector:
    eks.amazonaws.com/capacityType: ON_DEMAND

  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3
    accessModes:
      - ReadWriteOnce
    whenScaled: Retain
    whenDeleted: Retain
    enableStatefulSetAutoDeletePVC: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

minio:
  enabled: false
