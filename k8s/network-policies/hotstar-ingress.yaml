apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hotstar-allow-alb
  namespace: hotstar
spec:
  podSelector:
    matchLabels:
      app: hotstar-clone
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.1.0/24
        - ipBlock:
            cidr: 10.0.2.0/24
      ports:
        - protocol: TCP
          port: 8080
