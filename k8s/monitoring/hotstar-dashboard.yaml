apiVersion: v1
kind: ConfigMap
metadata:
  name: hotstar-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hotstar-dashboard.json: |
    {
      "title": "Hotstar EKS DevSecOps Monitoring",
      "uid": "hotstar-devsecops",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Hotstar Running Pods",
          "type": "stat",
          "gridPos": {"x":0,"y":0,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "count(kube_pod_status_phase{namespace=\"default\",pod=~\"hotstar-clone-.*\",phase=\"Running\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "HPA Desired Replicas",
          "type": "stat",
          "gridPos": {"x":6,"y":0,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"default\",horizontalpodautoscaler=\"hotstar-clone\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "HPA Current Replicas",
          "type": "stat",
          "gridPos": {"x":12,"y":0,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"default\",horizontalpodautoscaler=\"hotstar-clone\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Hotstar CPU Usage",
          "type": "timeseries",
          "gridPos": {"x":0,"y":5,"w":12,"h":8},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"hotstar-clone-.*\",container!=\"POD\",container!=\"\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Hotstar Memory Usage",
          "type": "timeseries",
          "gridPos": {"x":12,"y":5,"w":12,"h":8},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",pod=~\"hotstar-clone-.*\",container!=\"POD\",container!=\"\"}) / 1024 / 1024",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Cluster Autoscaler - Ready Nodes",
          "type": "stat",
          "gridPos": {"x":0,"y":13,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "cluster_autoscaler_nodes_count{state=\"ready\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Cluster Autoscaler - Max Nodes",
          "type": "stat",
          "gridPos": {"x":6,"y":13,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "cluster_autoscaler_max_nodes_count",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Cluster Autoscaler - Unschedulable Pods",
          "type": "stat",
          "gridPos": {"x":12,"y":13,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "cluster_autoscaler_unschedulable_pods_count{type=\"unschedulable\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Cluster Autoscaler - Nodes Scaled Up",
          "type": "stat",
          "gridPos": {"x":18,"y":13,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "cluster_autoscaler_scaled_up_nodes_total",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Cluster Autoscaler - Nodes Scaled Down",
          "type": "stat",
          "gridPos": {"x":0,"y":18,"w":6,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "sum(cluster_autoscaler_scaled_down_nodes_total)",
              "refId": "A"
            }
          ]
        },
        ,
        {
          "id": 11,
          "title": "VPA Objects by Update Mode",
          "type": "timeseries",
          "gridPos": {"x":6,"y":18,"w":9,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "sum by (update_mode) (vpa_recommender_vpa_objects_count)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "VPA Aggregate Container States",
          "type": "stat",
          "gridPos": {"x":15,"y":18,"w":9,"h":5},
          "targets": [
            {
              "datasource":{"type":"prometheus","uid":"prometheus"},
              "expr": "vpa_recommender_aggregate_container_states_count",
              "refId": "A"
            }
          ]
        }
      ]
    }