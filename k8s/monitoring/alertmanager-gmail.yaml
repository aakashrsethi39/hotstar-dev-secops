apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: hotstar-gmail
  namespace: monitoring
spec:
  route:
    receiver: gmail-notifications
    matchers:
      - name: alertname
        matchType: =~
        value: "Hotstar.*"
    groupBy:
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: gmail-notifications
      emailConfigs:
        - to: "aakashrsethi39@gmail.com"
          from: "aakashrsethi39@gmail.com"
          smarthost: "smtp.gmail.com:587"
          authUsername: "aakashrsethi39@gmail.com"
          authPassword:
            name: alertmanager-gmail
            key: smtp-password
          requireTLS: true
          sendResolved: true
