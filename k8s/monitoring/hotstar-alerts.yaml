apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hotstar-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: hotstar.rules
      rules:
        - alert: HotstarHighCPU
          expr: |
            sum(
              rate(container_cpu_usage_seconds_total{
                namespace="hotstar",
                pod=~"hotstar-clone-.*",
                container!="",
                container!="POD"
              }[5m])
            ) > 0.7
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hotstar application CPU usage is high"
            description: "Hotstar containers are consuming more than 0.7 CPU cores in total."

        - alert: HotstarPodFailure
          expr: |
            (
              sum(
                kube_deployment_status_replicas_available{
                  namespace="hotstar",
                  deployment="hotstar-clone"
                }
              ) or vector(0)
            ) < 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Hotstar has fewer than 2 available replicas"
            description: "The Hotstar deployment has fewer than 2 available replicas for 5 minutes."

        - alert: HotstarHPAMaximum
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{
              namespace="hotstar",
              horizontalpodautoscaler="hotstar-clone"
            }
            >=
            on(namespace, horizontalpodautoscaler)
            kube_horizontalpodautoscaler_spec_max_replicas{
              namespace="hotstar",
              horizontalpodautoscaler="hotstar-clone"
            }
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hotstar HPA reached maximum replicas"
            description: "Hotstar HPA has reached its configured maximum replica count."
